name: macOS build (unsigned validation)
on:
  workflow_dispatch:
  push:
    branches: [main, "integration/**"]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and stage shared UI
        run: ./scripts/build-web.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd apps/macos && xcodegen generate --spec project.yml
      - name: Build unsigned app
        run: |
          xcodebuild -resolvePackageDependencies -project apps/macos/DeepSeekMac.xcodeproj -scheme DeepSeekMac
          xcodebuild -project apps/macos/DeepSeekMac.xcodeproj -scheme DeepSeekMac -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      # 发布签名、公证与 Sparkle 需要专门配置的 GitHub Actions Secrets，参见 docs/08-release.md。
