name: macOS build (unsigned validation)
on:
  workflow_dispatch:
  push:
    branches: [main, "integration/**"]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned app
        run: ./scripts/bootstrap-macos.sh
      - name: Verify bundled release version
        run: |
          plist=artifacts/macos/Build/Products/Debug/DeepSeek.app/Contents/Info.plist
          expected="$(cat VERSION)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :DeepDeskReleaseVersion' "$plist")" = "$expected"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "${expected%%-*}"
      # 发布签名、公证与 Sparkle 需要专门配置的 GitHub Actions Secrets，参见 docs/macos/08-release.md。
