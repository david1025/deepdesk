name: Windows build
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deepdesk-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install UI dependencies
        working-directory: src/chat-ui
        run: pnpm install
      - name: Type-check UI
        working-directory: src/chat-ui
        run: pnpm type
      - name: Build UI
        working-directory: src/chat-ui
        run: pnpm build
      - name: Build WPF application
        run: dotnet build src/DeepDesk/DeepDesk.csproj -c Release
      - name: Publish self-contained Windows x64 app
        run: dotnet publish src/DeepDesk/DeepDesk.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/DeepDesk-win-x64
      - name: Upload Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: DeepDesk-win-x64
          path: artifacts/DeepDesk-win-x64/
          if-no-files-found: error
          retention-days: 14
