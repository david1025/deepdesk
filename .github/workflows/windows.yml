name: Windows build
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main, "feature/windows-native-shell"]
  workflow_dispatch:

concurrency:
  group: deepdesk-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout official DeepSeek Chat Demo
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/chat-demo
          ref: 429af5a4558469496b231631e850fbccc0c30c87
          path: vendor/chat-demo
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install official UI dependencies
        working-directory: vendor/chat-demo
        run: pnpm install --frozen-lockfile

      - name: Patch official UI for DeepDesk desktop features
        run: node scripts/patch-chat-demo.mjs vendor/chat-demo

      - name: Type-check official UI
        working-directory: vendor/chat-demo
        shell: pwsh
        run: |
          pnpm type 2>&1 | Tee-Object -FilePath typecheck.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload type-check diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deepdesk-typecheck-diagnostics
          path: vendor/chat-demo/typecheck.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build official DeepSeek UI
        working-directory: vendor/chat-demo
        shell: pwsh
        env:
          NODE_ENV: production
        run: |
          if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force }
          pnpm exec rspack build -c rspack.config.ts

      - name: Stage official UI into desktop host
        shell: pwsh
        run: |
          if (Test-Path "src/chat-ui/dist") { Remove-Item "src/chat-ui/dist" -Recurse -Force }
          New-Item -ItemType Directory -Force "src/chat-ui/dist" | Out-Null
          Copy-Item "vendor/chat-demo/dist/*" "src/chat-ui/dist/" -Recurse -Force
          Copy-Item "vendor/chat-demo/LICENSE" "src/chat-ui/dist/LICENSE" -Force
          Copy-Item "src/DeepDesk/Assets/deepdesk-logo.png" "src/chat-ui/dist/deepdesk-logo.png" -Force
          Set-Content -Path "src/chat-ui/dist/UPSTREAM_VERSION.txt" -Value "deepseek-ai/chat-demo@429af5a4558469496b231631e850fbccc0c30c87"

      - name: Build WPF host
        run: dotnet build src/DeepDesk/DeepDesk.csproj -c Release

      - name: Publish lightweight Windows x64 app
        run: dotnet publish src/DeepDesk/DeepDesk.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/DeepDesk-win-x64-lite

      - name: Publish self-contained Windows x64 app
        run: dotnet publish src/DeepDesk/DeepDesk.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/DeepDesk-win-x64

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            throw "Inno Setup compiler was not installed."
          }

      - name: Compile Windows installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/DeepDesk.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DeepDesk-Setup-x64
          path: artifacts/installer/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload lightweight Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: DeepDesk-win-x64-lite
          path: artifacts/DeepDesk-win-x64-lite/
          if-no-files-found: error
          retention-days: 14

      - name: Upload self-contained Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: DeepDesk-win-x64
          path: artifacts/DeepDesk-win-x64/
          if-no-files-found: error
          retention-days: 14
