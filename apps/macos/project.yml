name: DeepSeekMac
options:
  minimumXcodeGenVersion: 2.38.0
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: '13.0'
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: '5.9'
    MACOSX_DEPLOYMENT_TARGET: '13.0'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  DeepSeekMac:
    type: application
    platform: macOS
    deploymentTarget: '13.0'
    sources:
      - path: Sources
      - path: Resources/Web
        type: folder
        buildPhase: resources
      - path: ../../licenses/Sparkle-LICENSE
        buildPhase: resources
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Config/AppIcon.xcassets
        buildPhase: resources
    configFiles:
      Debug: Config/Version.generated.xcconfig
      Release: Config/Version.generated.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.deepseekmac
        PRODUCT_NAME: DeepSeek
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/DeepSeekMac.entitlements
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 3
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: Sparkle
    scheme:
      testTargets: []
